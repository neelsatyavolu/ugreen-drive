  <style id="ugd-theme-critical">
    html, body { margin: 0; background: #0E0E0D; color: #F2F0EA; color-scheme: dark; }
    html.light, html.light body { background: #F7F5EF; color: #16161A; color-scheme: light; }
  </style>
  <link rel="stylesheet" href="/assets/app.css?v=20261026-ugd1" />
  <script>
    (function () {
      function apply(theme) {
        var root = document.documentElement;
        var light = theme === "light";
        root.classList.toggle("light", light);
        root.dataset.theme = light ? "light" : "dark";
        root.style.colorScheme = light ? "light" : "dark";
        var scheme = document.getElementById("meta-color-scheme");
        var color = document.getElementById("meta-theme-color");
        if (scheme) scheme.setAttribute("content", light ? "light" : "dark");
        if (color) color.setAttribute("content", light ? "#F7F5EF" : "#0E0E0D");
      }
      try {
        apply(localStorage.getItem("ifd-theme") === "light" ? "light" : "dark");
      } catch (e) {
        apply("dark");
      }
    })();
  </script>
